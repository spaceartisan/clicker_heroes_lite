<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clicker Heroes Lite</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <h1>Clicker Heroes Lite</h1>

    <div id="enemy-container">
      <button id="prev-level" onclick="goToPrevLevel()">⬅</button>

      <div id="enemy-box">
        <div id="enemy-wrapper">
          <canvas id="enemy-canvas" width="150" height="150"></canvas>
          <div id="damage-overlay"></div>
        </div>
        <div id="health-bar">
          <div id="health-fill"></div>
        </div>
        <p id="enemy-level">Level: 1</p>
      </div>

      <button id="next-level" onclick="goToNextLevel()">➡</button>
    </div>

    <div id="auto-level-container">
      <label>
        <input type="checkbox" id="auto-next-toggle" checked>
        Auto advance to next level
      </label>
    </div>

    <div id="stats">
      <p>Gold: <span id="gold">0</span></p>
      <p>Damage: <span id="damage">Click: 1, Auto: 1</span></p>
    </div>

    <div id="shop">
      <h2>Shop</h2>
      <button onclick="buyClickUpgrade()">Upgrade Click Damage x2 (Cost: <span id="click-upgrade-cost">10</span> gold)</button>
    </div>

    <div id="mercenary-shop">
      <h2>Mercenaries</h2>
      <button onclick="hireMercenary()">Hire Mercenary (Cost: <span id="auto-clicker-cost">50</span> gold)</button>
      <p>Mercenaries Hired: <span id="auto-clicker-count">0</span></p>
    </div>

    <script src="script.js"></script>
  </div>
</body>
</html>
