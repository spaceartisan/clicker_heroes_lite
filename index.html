<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clicker Heroes Lite</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game-container">
    <h1>Clicker Heroes Lite</h1>

    <div id="enemy-container">
      <button id="prev-level" onclick="goToPrevLevel()">⬅</button>

      <div id="enemy-box">
        <div id="enemy-wrapper">
          <canvas id="enemy-canvas" width="150" height="150"></canvas>
          <div id="damage-overlay"></div>
        </div>
        <div id="health-bar">
          <div id="health-fill"></div>
        </div>
        <p id="enemy-level">Level: 1</p>
      </div>

      <button id="next-level" onclick="goToNextLevel()">➡</button>
    </div>

    <div id="auto-level-container">
      <label>
        <input type="checkbox" id="auto-next-toggle" checked>
        Auto advance to next level
      </label>
    </div>

    <div id="stats">
      <p>Gold: <span id="gold">0</span></p>
      <p>Damage: <span id="damage">Click: 1, Auto: 0</span></p>
    </div>

    <div id="ability-bar">
        <div class="ability-header">
            <h3>Hero Abilities</h3>
        </div>
        <div class="ability-buttons">
            <button id="strong-attack">Strong Attack</button>
            <button id="rally">Rally</button>
            <button id="double-attack">Double Attack</button>
            <button id="rage">Rage</button>
        </div>
    </div>

    <div id="shop">
      <!-- Dynamic player upgrades added by JS -->
    </div>

    <div id="mercenary-shop">
      <h3>Mercenaries</h3>
      <button onclick="hireMercenary()">Hire Mercenary (Cost: <span id="auto-clicker-cost">50</span> gold)</button>
      <button onclick="increaseMercenaryCap()">Upgrade Guild (Cost: <span id="guild-cost">10000</span> gold)</button>
      <p>Mercenaries Hired: <span id="auto-clicker-count">0/5</span></p>
      <!-- Mercenaries will populate here -->
    </div>

    <h3></h3>
    <div id="save-load-controls">
        <button onclick="saveGame()">💾 Save Game</button>
        <button onclick="deleteSave()">🗑️ Delete Save</button>
    </div>

    <div>
        <span id="autosave-indicator" style="opacity: 0;">💾 Autosaved!</span>
    </div>
    

    <script src="script.js"></script>
  </div>
</body>
</html>
