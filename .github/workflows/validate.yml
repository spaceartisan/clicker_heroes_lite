name: Validate Heroes of the Click
on:
  push:
    branches: [main, feature/kingdom-combat-depth]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in config.js combat-content.js hero.js kingdom.js enemy.js database.js ui.js game.js sw.js; do
            node --check "$file"
          done
      - name: Regression tests
        run: node tests/smoke-test.cjs
