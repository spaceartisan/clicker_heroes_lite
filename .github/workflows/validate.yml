name: Validate Heroes of the Click
on:
  push:
    branches: [main, feature/royal-research-balance]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in config.js season.js research.js progression.js frontier.js combat-content.js hero.js kingdom.js enemy.js database.js ui.js game.js army.js sw.js player-account.js session-guard.js account-leaderboard.js functions/index.js functions/session-core.js; do
            node --check "$file"
          done
      - name: Regression tests
        run: |
          node tests/smoke-test.cjs
          node tests/player-account-test.cjs
          node tests/account-leaderboard-test.cjs
          node tests/session-guard-test.cjs
